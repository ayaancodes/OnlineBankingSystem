<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transaction History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Transaction History</h1>
  </header>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html" class="active">Transactions</a>
    <a href="#" id="logout">Logout</a>
  </nav>

  <div class="container">
    <div id="transactionsList">
      <p>Loading your transactions...</p>
    </div>
  </div>


\


  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const userId = localStorage.getItem("userId");
      if (!userId) {
        alert("You must be logged in!");
        window.location.href = "index.html";
        return;
      }

      try {
        const res = await fetch(`http://localhost:8080/transactions?userId=${userId}`);
        const transactions = await res.json();

        const list = document.getElementById("transactionsList");
        list.innerHTML = "";

        if (transactions.length === 0) {
          list.innerHTML = "<p>No transactions found.</p>";
        } else {
          transactions.forEach(tx => {
            const item = document.createElement("div");
            item.className = "transaction-item";
            item.textContent = `#${tx.id} | ${tx.type} | $${tx.amount} | ${tx.timestamp}`;
            list.appendChild(item);
          });
        }
      } catch (err) {
        console.error(err);
        alert("Failed to load transactions.");
      }
    });
  </script>
</body>
</html>
